name: Build and Push for cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Ensure package lock
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: PHP syntax check
        run: |
          find public/api scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Copy backend files and configs
        run: |
          mkdir -p dist/api
          rsync -av --exclude='data.json' public/api/ dist/api/ || true
          cp .htaccess dist/ || true

      - name: Commit generated artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/ package-lock.json -f
          git commit -m "chore: automated build [skip ci]" || echo "No changes to commit"
          git push origin main
