name: Build and Push for cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Ensure package lock
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: PHP syntax check
        run: |
          find public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify prerender output
        run: |
          test -f dist/index.php || { echo "dist/index.php missing"; exit 1; }
          grep -q 'assets/' dist/index.php || { echo "asset tags not injected into dist/index.php"; exit 1; }
          grep -q 'VITE_ASSETS' dist/index.php && { echo "asset marker still present"; exit 1; }
          test -f dist/_prerender.php || { echo "dist/_prerender.php missing"; exit 1; }
          test -f dist/sitemap.php || { echo "dist/sitemap.php missing"; exit 1; }
          echo "prerender artifacts OK"

      - name: Copy backend files and configs
        run: |
          mkdir -p dist/api
          rsync -av --exclude='data.json' public/api/ dist/api/ || true

      - name: Commit generated artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/ package-lock.json -f
          git commit -m "chore: automated build [skip ci]" || echo "No changes to commit"
          # Rebase before pushing: two pushes in quick succession used to fail here.
          git pull --rebase origin main
          git push origin main
